name: RevPulse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: revpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize PostgreSQL Roles
        run: |
          PGPASSWORD=postgrespassword psql -h localhost -U postgres -d revpulse -f scripts/init-db.sql

      - name: Run Alembic Database Migrations
        env:
          DATABASE_MIGRATION_URL: postgresql+psycopg://revpulse_migrator:migrator_secret_change_in_prod@localhost:5432/revpulse
        run: |
          alembic upgrade head

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://revpulse_app:app_secret_change_in_prod@localhost:5432/revpulse
          DATABASE_MIGRATION_URL: postgresql+psycopg://revpulse_migrator:migrator_secret_change_in_prod@localhost:5432/revpulse
          DATABASE_READONLY_URL: postgresql+psycopg://revpulse_readonly:readonly_secret_change_in_prod@localhost:5432/revpulse
          SECRET_KEY: test-secret-key-1234
          STRIPE_ENCRYPTION_KEY: dGVzdC1lbmNyeXB0aW9uLWtleS0zMnZhbGlkLWJhc2U2NA==
        run: |
          pytest -v --cov=app --cov=lib
