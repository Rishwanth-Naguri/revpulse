{% extends "base.html" %}

{% block title %}Sign In - RevPulse{% endblock %}

{% block public_content %}
<div class="min-h-[calc(100vh-4rem)] flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-2xl bg-brand-600/20 border border-brand-500/30 flex items-center justify-center text-brand-400 mx-auto mb-3 shadow-lg shadow-brand-500/10">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Welcome back to RevPulse</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to review your revenue analytics</p>
    </div>

    <div class="glass p-8 rounded-2xl border border-slate-800 shadow-2xl">
      <!-- Demo Login Fast Action -->
      <div class="mb-6 pb-6 border-b border-slate-800">
        <a href="{{ url_for('auth.demo_login') }}" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-semibold text-xs shadow-lg shadow-brand-600/25 transition-all flex items-center justify-center gap-2">
          <i data-lucide="play" class="w-4 h-4 fill-white"></i>
          Explore Demo Mode (1-Click Instant Login)
        </a>
      </div>

      <form action="{{ url_for('auth.login') }}" method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1.5">Email Address</label>
          <input type="email" name="email" required placeholder="founder@company.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors">
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="block text-xs font-semibold text-slate-400">Password</label>
            <a href="#" class="text-[11px] text-brand-400 hover:underline">Forgot password?</a>
          </div>
          <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-sm text-white focus:outline-none focus:border-brand-500 transition-colors">
        </div>

        <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs border border-slate-600 transition-all flex items-center justify-center gap-2 mt-2">
          <span>Sign In</span>
          <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
        </button>
      </form>

      <p class="text-center text-xs text-slate-400 mt-6">
        Don't have an account yet? 
        <a href="{{ url_for('auth.signup') }}" class="font-semibold text-brand-400 hover:underline">Start free trial</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
