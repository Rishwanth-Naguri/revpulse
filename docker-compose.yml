version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: revpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: revpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_superuser_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: revpulse_postgres_data
